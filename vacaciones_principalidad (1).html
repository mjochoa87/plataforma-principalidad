  .welcome-card p.sub{ color:var(--muted); font-size:14px; margin-bottom:32px; }

  .btn-ghost{ background:transparent; color:var(--muted); border-color:transparent; padding:8px 10px; }

  .btn-danger{ background:var(--red-bg); color:var(--red); }

/* =========================================================
   UTILIDADES DE FECHA
========================================================= */
function pad2(n){ return String(n).padStart(2,"0"); }
function parseYMD(str){
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y, m-1, d);
}
function formatYMD(date){
  return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`;
}
function today(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function addDays(date,n){
  const d = new Date(date); d.setDate(d.getDate()+n); return d;
}
function monthsBetween(a,b){
  let months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if (b.getDate() < a.getDate()) months--;
  return Math.max(0, months);
}
function isBusinessDay(date, feriadosSet){
  const dow = date.getDay();
  if (dow === 0 || dow === 6) return false;
  if (feriadosSet.has(formatYMD(date))) return false;
  return true;
}
function businessDaysBetween(startStr, endStr, feriadosSet){
  if (!startStr || !endStr) return 0;
  let start = parseYMD(startStr), end = parseYMD(endStr);
  if (end < start) return 0;
  let count = 0, cur = new Date(start);
  while (cur <= end){
    if (isBusinessDay(cur, feriadosSet)) count++;
    cur = addDays(cur,1);
  }
  return count;
}
function fmtDisplay(str){
  if (!str) return "—";
  return str;
}

/* =========================================================

function escalaDias(ingresoStr, hastaDate){
  const ingreso = parseYMD(ingresoStr);
  const meses = monthsBetween(ingreso, hastaDate);
  if (meses < 6) return meses;
  const anios = meses/12;
  if (anios < 5) return 10;
  if (anios < 10) return 15;
  return 20;
}
function antiguedadTexto(ingresoStr){
  const ingreso = parseYMD(ingresoStr);
  const meses = monthsBetween(ingreso, today());
  const anios = Math.floor(meses/12);
  const mesesResto = meses%12;
  if (meses < 1) return "menos de 1 mes";
  if (anios === 0) return `${meses} mes${meses===1?"":"es"}`;
  return mesesResto===0 ? `${anios} año${anios===1?"":"s"}` : `${anios}a ${mesesResto}m`;
}
/** Calcula correspondientes/tomados/pendientes por cada período aplicable a una persona */
function desglosePorPeriodo(persona, solicitudesAprobadasPersona){
  const hoy = today();
  const out = [];
  for (const per of PERIODOS){
    const perInicio = parseYMD(per.inicio), perFin = parseYMD(per.fin);
    if (hoy < perInicio) continue; // el período todavía no arrancó
    const ingreso = parseYMD(persona.ingreso);
    if (ingreso > perFin) continue; // todavía no había ingresado

    const finCalculo = hoy < perFin ? hoy : perFin;
    let correspondientes;
    if (ingreso <= perInicio){
      correspondientes = persona.objetivo != null ? persona.objetivo : escalaDias(persona.ingreso, finCalculo);
    } else {
      const escalaAnual = persona.objetivo != null ? persona.objetivo : escalaDias(persona.ingreso, finCalculo);
      const mesesEnPeriodo = monthsBetween(ingreso, finCalculo);
      correspondientes = Math.round((escalaAnual/12) * mesesEnPeriodo * 100) / 100;
    }
    correspondientes = Math.max(0, Math.round(correspondientes));

    // días tomados dentro de este período: solicitudes aprobadas cuyo inicio cae en el período,
    // más (solo para el período vigente más antiguo con datos) el arrastre histórico cargado en el alta.
    let tomadosSolicitudes = 0;
    for (const s of solicitudesAprobadasPersona){
      const sIni = parseYMD(s.inicio);
      if (sIni >= perInicio && sIni <= perFin) tomadosSolicitudes += (s.diasHab || 0);
    }
    let tomados = tomadosSolicitudes;
    if (per.id === PERIODOS[0].id){
      tomados += (persona.tomados || 0); // arrastre histórico cargado manualmente en el alta
    }
    const pendientes = Math.max(0, correspondientes - tomados);
    out.push({ periodo: per.label, correspondientes, tomados, pendientes });
  }
  return out;
}

function slugify(str){
  return str.toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

/* =========================================================
   SEED (solo si la base está vacía)
========================================================= */
async function seedIfEmpty(){
  const snap = await get(ref(db, "personas"));
  if (snap.exists()) return;

  const personasSeed = {};
  for (const [nombre, ingreso] of SEED_TL){
    const id = slugify(nombre);
    personasSeed[id] = { nombre, rol:"TL", ingreso, tomados:0, objetivo:null, diasHabMes:null, activo:true, fechaDesvinculacion:null };
  }
  for (const [nombre, ingreso, tomados] of SEED_ASESORES){
    const id = slugify(nombre);
    personasSeed[id] = { nombre, rol:"Asesor", ingreso, tomados, objetivo:null, diasHabMes:null, activo:true, fechaDesvinculacion:null };
  }
  const mailsSeed = {};
  TLS.forEach(tl => { mailsSeed[slugify(tl)] = ""; });

  await set(ref(db), {
    personas: personasSeed,
    solicitudes: {},
    feriados: SEED_FERIADOS,
    config: { clave: CLAVE_DEFAULT, mails: mailsSeed }
  });
}

/* =========================================================
   LISTENERS FIREBASE
========================================================= */
function iniciarListeners(){
  onValue(ref(db,"personas"), snap => {
    personas = snap.val() || {};
    dataReady.personas = true; conectado = true;
    render();
  }, () => { conectado = false; render(); });

  onValue(ref(db,"solicitudes"), snap => {
    solicitudes = snap.val() || {};
    dataReady.solicitudes = true;
    render();
  });

  onValue(ref(db,"feriados"), snap => {
    feriados = snap.val() || {};
    dataReady.feriados = true;
    render();
  });

  onValue(ref(db,"config"), snap => {
    const v = snap.val();
    config = v || { clave: CLAVE_DEFAULT, mails:{} };
    if (!config.mails) config.mails = {};
    dataReady.config = true;
    render();
  });
}

function feriadosSet(){ return new Set(Object.keys(feriados || {})); }

function isDataReady(){
  return dataReady.personas && dataReady.solicitudes && dataReady.feriados && dataReady.config;
}

/* =========================================================
   ESCRITURAS
========================================================= */
async function guardarPersona(id, data){
  await update(ref(db, `personas/${id}`), data);
}
async function crearPersona(data){
  const id = slugify(data.nombre) + "-" + Math.random().toString(36).slice(2,6);
  await set(ref(db, `personas/${id}`), {
    nombre:data.nombre, rol:data.rol, ingreso:data.ingreso, tomados:Number(data.tomados)||0,
    objetivo: data.objetivo!=="" && data.objetivo!=null ? Number(data.objetivo) : null,
    diasHabMes:null, activo:true, fechaDesvinculacion:null
  });
}
async function desvincularPersona(id){
  await update(ref(db, `personas/${id}`), { activo:false, fechaDesvinculacion: formatYMD(today()) });
}
async function reactivarPersona(id){
  await update(ref(db, `personas/${id}`), { activo:true, fechaDesvinculacion:null });
}
async function crearSolicitud(data){
  const newRef = push(ref(db,"solicitudes"));
  await set(newRef, {
    personaId: data.personaId, inicio:data.inicio, fin:data.fin,
    diasHab: businessDaysBetween(data.inicio, data.fin, feriadosSet()),
    estado: data.estado || "pendiente",
    aprobacion: data.aprobacion || "Pendiente",
    aviso: data.aviso || "No",
    tl: data.tl || "",
    obs: data.obs || "",
    fecha: new Date().toISOString(),
    origen: data.origen || "admin",
  });
  return newRef.key;
}
async function actualizarEstadoSolicitud(id, estado){
  await update(ref(db, `solicitudes/${id}`), { estado, aprobacion: estado==="aprobada"?"Sí":(estado==="rechazada"?"No":"Pendiente") });
}
async function guardarClave(nuevaClave){
  await update(ref(db,"config"), { clave: nuevaClave });
}
async function guardarMailTL(tlId, mail){
  await update(ref(db, `config/mails`), { [tlId]: mail });
}
async function agregarFeriado(fecha, desc){
  await update(ref(db,"feriados"), { [fecha]: desc });
}
async function quitarFeriado(fecha){
  await remove(ref(db, `feriados/${fecha}`));
}

/* =========================================================
   TOAST
========================================================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2600);
}

/* =========================================================
   HELPERS DE DATOS DERIVADOS
========================================================= */
function personasActivas(incluirInactivos=false){
  return Object.entries(personas)
    .filter(([id,p]) => incluirInactivos ? true : p.activo!==false)
    .map(([id,p]) => ({id, ...p}));
}
function solicitudesArray(){
  return Object.entries(solicitudes).map(([id,s]) => ({id, ...s}));
}
function solicitudesAprobadasDe(personaId){
  return solicitudesArray().filter(s => s.personaId===personaId && s.estado==="aprobada");
}
function nombrePersona(id){
  return personas[id] ? personas[id].nombre : "(persona eliminada)";
}
function estadoBadge(estado){
  if (estado==="aprobada") return `<span class="badge badge-green">Aprobada</span>`;
  if (estado==="rechazada") return `<span class="badge badge-red">Rechazada</span>`;
  return `<span class="badge badge-amber">Pendiente</span>`;
}

/* =========================================================
   RENDER PRINCIPAL
========================================================= */
function render(){
  const app = document.getElementById("app");
  if (!isDataReady()){
    app.innerHTML = `<div class="centered-shell"><p style="color:var(--muted); font-size:14px;">Conectando con la base de datos…</p></div>`;
    return;
  }
  if (state.screen === "welcome") app.innerHTML = renderWelcome();
  else if (state.screen === "asesor") app.innerHTML = renderAsesor();
  else if (state.screen === "admin-login") app.innerHTML = renderAdminLogin();
  else if (state.screen === "admin") app.innerHTML = renderAdmin();

  const modalHost = document.createElement("div");
  if (state.modal){
    modalHost.innerHTML = renderModal();
    app.appendChild(modalHost.firstElementChild);
  }
}

  lista.filter(p=>p.activo!==false).forEach(p=>{
    const desg = desglosePorPeriodo(p, solicitudesAprobadasDe(p.id));
    let totalPend = 0;
    desg.forEach((d,idx)=>{ if(d.pendientes>0) pendPorPeriodo[PERIODOS[idx].id]++; totalPend+=d.pendientes; });
    if (desg.length>0 && totalPend===0) completados++;
  });

  if (f.q) lista = lista.filter(p=>p.nombre.toLowerCase().includes(f.q.toLowerCase()));

  if (f.pend==="desvinculados") lista = lista.filter(p=>p.activo===false);

/* ---------- TAB: ALERTAS ---------- */
function calcularSuperposiciones(){
  const activas = solicitudesArray().filter(s=> s.estado==="pendiente" || s.estado==="aprobada");
  if (activas.length===0) return [];
  const counts = new Map(); // fecha -> [solicitudId,...]
  activas.forEach(s=>{
    let cur = parseYMD(s.inicio); const end = parseYMD(s.fin);
    while (cur<=end){
      const key = formatYMD(cur);
      if (!counts.has(key)) counts.set(key, []);
      counts.get(key).push(s.personaId);
      cur = addDays(cur,1);
    }
  });
  const fechasConflicto = [...counts.entries()].filter(([f,ids])=>new Set(ids).size>=5).sort((a,b)=>a[0].localeCompare(b[0]));
  // agrupar fechas contiguas en bloques
  const bloques = [];
  fechasConflicto.forEach(([f,ids])=>{
    const ultimo = bloques[bloques.length-1];
    const fDate = parseYMD(f);
    if (ultimo && formatYMD(addDays(parseYMD(ultimo.fin),1))===f){
      ultimo.fin = f;
      ids.forEach(id=>ultimo.personas.add(id));
    } else {
      bloques.push({ inicio:f, fin:f, personas:new Set(ids) });
    }
  });
  return bloques;
}

/* =========================================================

========================================================= */
const App = {
  ir(screen){
    state.screen = screen;
    state.adminLoginError = "";
    render();
  },
  seleccionarAsesor(id){
    state.asesorSeleccionado = id || null;
    render();
  },
  async enviarSolicitudAsesor(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const inicio = fd.get("inicio"), fin = fd.get("fin");
    if (parseYMD(fin) < parseYMD(inicio)){ toast("La fecha fin no puede ser anterior al inicio"); return; }
    const personaId = state.asesorSeleccionado;
    const tl = fd.get("tl"); const obs = fd.get("obs");
    await crearSolicitud({ personaId, inicio, fin, tl, obs, estado:"pendiente", origen:"asesor" });
    toast("Solicitud enviada. Quedó pendiente de aprobación.");
    const persona = personas[personaId];
    const mailTL = config.mails && config.mails[slugify(tl)];
    if (mailTL){
      const asunto = encodeURIComponent(`Solicitud de vacaciones — ${persona.nombre}`);
      const cuerpo = encodeURIComponent(`Hola ${tl},\n\n${persona.nombre} solicita vacaciones del ${inicio} al ${fin}.\nObservaciones: ${obs||"—"}\n\nSaludos.`);
      window.location.href = `mailto:${mailTL}?subject=${asunto}&body=${cuerpo}`;
    }
    e.target.reset();
    render();
  },
  intentarLoginAdmin(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const clave = fd.get("clave");
    if (clave === (config.clave || CLAVE_DEFAULT)){
      state.screen = "admin"; state.adminLoginError = "";
    } else {
      state.adminLoginError = "Clave incorrecta.";
    }
    render();
  },
  setAdminTab(tab){ state.adminTab = tab; render(); },
  filtrar(seccion, campo, valor){
    state.filtros[seccion][campo] = valor;
    render();
  },
  abrirModal(type, id){ state.modal = { type, id }; render(); },
  cerrarModal(){ state.modal = null; render(); },
  async guardarEdicion(e,id){
    e.preventDefault();
    const fd = new FormData(e.target);
    const objetivoRaw = fd.get("objetivo");
    await guardarPersona(id, {
      nombre: fd.get("nombre"), rol: fd.get("rol"), ingreso: fd.get("ingreso"),
      tomados: Number(fd.get("tomados"))||0,
      objetivo: objetivoRaw!=="" ? Number(objetivoRaw) : null,
      activo: fd.get("activo")==="true",
      fechaDesvinculacion: fd.get("activo")==="true" ? null : (personas[id].fechaDesvinculacion || formatYMD(today())),
    });
    toast("Cambios guardados.");
    state.modal = null; render();
  },
  async confirmarDesvinculo(id){
    if (confirm(`¿Desvincular a ${personas[id].nombre}?`)){
      await desvincularPersona(id); toast("Persona desvinculada.");
    }
  },
  async reactivar(id){ await reactivarPersona(id); toast("Persona reactivada."); },
  async aprobar(id){ await actualizarEstadoSolicitud(id,"aprobada"); toast("Solicitud aprobada."); },
  async rechazar(id){ await actualizarEstadoSolicitud(id,"rechazada"); toast("Solicitud rechazada."); },
  toggleField(btn, fieldName, val){
    const wrap = btn.parentElement;
    wrap.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    wrap.nextElementSibling.value = val;
  },
  async crearSolicitudForm(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const inicio = fd.get("inicio"), fin = fd.get("fin");
    if (parseYMD(fin) < parseYMD(inicio)){ toast("La fecha fin no puede ser anterior al inicio"); return; }
    const aprobacion = fd.get("aprobacion");
    const estado = aprobacion==="Sí" ? "aprobada" : "pendiente";
    await crearSolicitud({
      personaId: fd.get("personaId"), inicio, fin, tl: fd.get("tl"), obs: fd.get("obs"),
      aprobacion, aviso: fd.get("aviso"), estado, origen:"admin"
    });
    toast("Solicitud creada.");
    state.modal = null; render();
  },
  async crearPersonaForm(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    await crearPersona({
      nombre: fd.get("nombre"), rol: fd.get("rol"), ingreso: fd.get("ingreso"),
      tomados: fd.get("tomados"), objetivo: fd.get("objetivo"),
    });
    toast("Persona agregada.");
    e.target.reset(); render();
  },
  async guardarMailsForm(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    for (const tl of TLS){
      const tlId = slugify(tl);
      await guardarMailTL(tlId, fd.get(tlId) || "");
    }
    toast("Mails guardados.");
  },
  async cambiarClaveForm(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    await guardarClave(fd.get("clave"));
    toast("Clave actualizada.");
    e.target.reset();
  },
  async agregarFeriadoForm(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    await agregarFeriado(fd.get("fecha"), fd.get("desc"));
    toast("Feriado agregado.");
    e.target.reset(); render();
  },
  async quitarFeriadoConfirm(fecha){
    if (confirm(`¿Quitar el feriado del ${fecha}?`)){
      await quitarFeriado(fecha); toast("Feriado quitado.");
    }
  },
};
